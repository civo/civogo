on:
  push:
    branches: [master]
  pull_request:
name: security

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1
      with:
        # govulncheck (x/vuln v1.8.0+) needs Go 1.26, and setup-go runs with GOTOOLCHAIN=local, so the
        # scan cannot borrow the go.mod toolchain: give it the 1.26 line (check-latest picks the
        # newest patch) independently of the GO_VERSION variable used by lint and test.
        go-version-input: '1.26'
        go-package: ./...
