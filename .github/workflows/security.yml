on:
  push:
    branches: [master]
  pull_request:
name: security

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1
      with:
        # The action runs with GOTOOLCHAIN=local, so the scan uses exactly the Go it installs:
        # read the toolchain line from go.mod so govulncheck checks the same patched standard
        # library that test and lint build with.
        go-version-input: ""
        go-version-file: go.mod
        go-package: ./...
